<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zenbot settings</title>
    <style>
      body { width: 320px; margin: 0; padding: 16px; box-sizing: border-box; font: 14px system-ui; color: #17202a; }
      h1 { margin: 0 0 6px; font-size: 20px; }
      p { color: #5f6368; }
      label { display: block; margin: 14px 0 5px; font-weight: 600; }
      input, button { width: 100%; box-sizing: border-box; padding: 9px; border-radius: 6px; font: inherit; }
      input { border: 1px solid #bbc2ca; }
      button { margin-top: 12px; border: 0; background: #174ea6; color: white; cursor: pointer; }
      #status { min-height: 20px; margin-bottom: 0; }
    </style>
  </head>
  <body>
    <h1>Zenbot</h1>
    <p>Open a Zendesk ticket, then select the Zenbot icon in the right panel.</p>
    <label for="apiKey">OpenAI API key</label>
    <input id="apiKey" type="password" autocomplete="off" placeholder="sk-...">
    <button id="save">Save key</button>
    <p id="status" role="status" aria-live="polite"></p>
    <script src="popup.js"></script>
  </body>
</html>
